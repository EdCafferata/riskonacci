name: Riskonacci
options:
  bundleIdPrefix: info.cafferata
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  Riskonacci:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: GoogleService-Info.plist
    dependencies:
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseAuth
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Riskonacci
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: info.cafferata.riskonacci
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        DEVELOPMENT_TEAM: 9J2S23WJH3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
schemes:
  Riskonacci:
    build:
      targets:
        Riskonacci: all
    run:
      config: Debug
      storeKitConfiguration: Sources/Resources/Riskonacci.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
